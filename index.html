<meta charset="utf-8" />
<title>AI &amp; Digital Skills for the Modern Optometrist — Session Details</title>
<meta name="viewport" content="width=1280" />
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Newsreader:ital,opsz,wght@0,6..72,400;0,6..72,500;0,6..72,600;1,6..72,400&family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet" />
<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>
<style>
  :root{
    --bg:#F2EFE6;
    --bg-2:#E8E3D2;
    --ink:#15121E;
    --ink-2:#3d3851;
    --ink-3:#6e687f;
    --line:#d8d2bd;
    --line-2:#c2b894;
    --teal:#5B57A6;
    --teal-deep:#3a3679;
    --teal-soft:#E5E3F2;
    --paper:#FBF9F2;
    --black:#0a0f10;
    --serif:'Newsreader', 'Iowan Old Style', Georgia, serif;
    --sans:'Helvetica Neue', Helvetica, Arial, sans-serif;
    --mono:'IBM Plex Mono', ui-monospace, Menlo, monospace;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{background:var(--bg);color:var(--ink);font-family:var(--sans);-webkit-font-smoothing:antialiased;}
  body{font-size:16px;line-height:1.55;}
  a{color:inherit}
  button{font:inherit;color:inherit;background:none;border:0;cursor:pointer}
  .wrap{max-width:1280px;margin:0 auto;padding:0 56px}
  .mono{font-family:var(--mono);font-size:11px;letter-spacing:.14em;text-transform:uppercase}
  .serif{font-family:var(--serif);font-weight:500;letter-spacing:-0.01em}
  .hairline{height:1px;background:var(--line)}

  /* Util / Top */
  .top{display:flex;align-items:center;justify-content:space-between;padding:22px 0;border-bottom:1px solid var(--line)}
  .brand{display:flex;align-items:center;gap:12px}
  .eye{width:28px;height:28px;display:grid;place-items:center;color:var(--teal)}
  .karya-mark{height:34px;width:auto;display:block}
  .karya-mark-sm{height:26px;width:auto;display:block}
  .brand-name{font-family:var(--serif);font-size:18px;font-weight:600;letter-spacing:-0.01em}
  .brand-sub{font-family:var(--mono);font-size:10.5px;letter-spacing:.16em;text-transform:uppercase;color:var(--ink-3);margin-left:14px;border-left:1px solid var(--line);padding-left:14px}
  .top-right{display:flex;align-items:center;gap:24px;font-family:var(--mono);font-size:11px;letter-spacing:.14em;text-transform:uppercase;color:var(--ink-2)}
  .top-right .dot{width:6px;height:6px;border-radius:50%;background:var(--teal);box-shadow:0 0 0 4px rgba(0,184,148,.18);display:inline-block;margin-right:8px;animation:pulse 2s infinite}
  @keyframes pulse{0%,100%{box-shadow:0 0 0 4px rgba(91,87,166,.20)}50%{box-shadow:0 0 0 7px rgba(91,87,166,.10)}}

  /* Hero */
  .hero{padding:64px 0 28px;border-bottom:1px solid var(--line)}
  .hero-grid{display:grid;grid-template-columns:1fr 360px;gap:48px;align-items:end}
  .eyebrow{display:flex;align-items:center;gap:14px;color:var(--ink-2)}
  .eyebrow .pill{display:inline-flex;align-items:center;gap:8px;padding:6px 10px;border:1px solid var(--line-2);border-radius:999px;background:var(--paper)}
  .eyebrow .pill .d{width:6px;height:6px;background:var(--teal);border-radius:50%}
  h1.title{font-family:var(--serif);font-weight:500;font-size:104px;line-height:0.96;letter-spacing:-0.035em;margin-top:24px;text-wrap:balance}
  h1.title em{font-style:italic;color:var(--teal-deep);font-weight:500}
  .lede{font-family:var(--serif);font-size:23px;line-height:1.4;color:var(--ink-2);max-width:620px;margin-top:28px;font-weight:400}
  .lede .accent{color:var(--ink);font-style:italic}
  .hero-meta{border-left:1px solid var(--line);padding-left:28px;display:flex;flex-direction:column;gap:24px}
  .hero-meta .row .k{color:var(--ink-3)}
  .hero-meta .row .v{font-family:var(--serif);font-size:24px;font-weight:500;margin-top:6px;line-height:1.15}
  .hero-meta .row .vv{font-family:var(--serif);font-size:18px;color:var(--ink-2);margin-top:2px}

  /* Marquee */
  .marquee{background:var(--ink);color:var(--paper);overflow:hidden;border-top:1px solid var(--ink);border-bottom:1px solid var(--ink)}
  .marquee-track{display:flex;gap:48px;padding:18px 0;white-space:nowrap;animation:scroll 38s linear infinite;font-family:var(--mono);font-size:12px;letter-spacing:.22em;text-transform:uppercase}
  .marquee-track span{display:inline-flex;align-items:center;gap:14px}
  .marquee-track .star{color:var(--teal);font-size:14px}
  @keyframes scroll{from{transform:translateX(0)}to{transform:translateX(-50%)}}

  /* Facts strip */
  .facts{display:grid;grid-template-columns:repeat(3,1fr);border-bottom:1px solid var(--line)}
  .fact{padding:36px 32px;border-right:1px solid var(--line);position:relative}
  .fact:last-child{border-right:0}
  .fact .lbl{color:var(--ink-3);margin-bottom:14px}
  .fact .val{font-family:var(--serif);font-size:36px;line-height:1.05;font-weight:500;letter-spacing:-0.02em}
  .fact .sub{font-size:13px;color:var(--ink-2);margin-top:8px;line-height:1.45}
  .fact .ic{position:absolute;top:30px;right:32px;color:var(--ink-3);opacity:.9}

  /* Section */
  section.block{padding:88px 0;border-bottom:1px solid var(--line)}
  .sec-head{display:grid;grid-template-columns:160px 1fr 1fr;gap:48px;align-items:start;margin-bottom:48px}
  .sec-num{font-family:var(--mono);font-size:11px;letter-spacing:.18em;text-transform:uppercase;color:var(--ink-3);padding-top:14px}
  .sec-num .big{display:block;font-family:var(--serif);font-size:48px;color:var(--ink);letter-spacing:-0.02em;line-height:1;margin-top:4px;font-weight:500}
  .sec-title{font-family:var(--serif);font-size:54px;font-weight:500;letter-spacing:-0.025em;line-height:1.02}
  .sec-title em{font-style:italic;color:var(--teal-deep)}
  .sec-desc{color:var(--ink-2);font-size:17px;line-height:1.6;padding-top:14px;max-width:420px}

  /* Curriculum list */
  .curric{display:grid;grid-template-columns:160px 1fr;gap:0}
  .curric-row{display:contents}
  .cell{padding:28px 0;border-top:1px solid var(--line);display:flex;align-items:baseline;gap:24px}
  .cell.time{font-family:var(--mono);font-size:12px;letter-spacing:.16em;text-transform:uppercase;color:var(--ink-2);padding-right:28px}
  .cell.body{padding-left:24px;border-left:1px solid var(--line)}
  .cell h3{font-family:var(--serif);font-size:30px;font-weight:500;letter-spacing:-0.015em;line-height:1.1;flex:1}
  .cell h3 .tag{display:inline-block;font-family:var(--mono);font-size:10px;letter-spacing:.18em;text-transform:uppercase;color:var(--teal-deep);background:var(--teal-soft);padding:4px 8px;border-radius:4px;margin-left:14px;vertical-align:middle;transform:translateY(-4px)}
  .cell p{color:var(--ink-2);font-size:15.5px;line-height:1.55;max-width:560px;margin-top:6px}
  .cell .dur{font-family:var(--mono);font-size:11px;color:var(--ink-3);letter-spacing:.14em;text-transform:uppercase;white-space:nowrap}
  .curric-row:hover .cell h3{color:var(--teal-deep)}
  .curric-row:hover .cell.time{color:var(--ink)}

  /* Live activities */
  .live-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:24px}
  .live-card{background:var(--paper);border:1px solid var(--line);border-radius:14px;padding:28px;display:flex;flex-direction:column;gap:18px;min-height:340px;position:relative;overflow:hidden;transition:transform .25s ease, border-color .25s ease, box-shadow .25s ease}
  .live-card:hover{transform:translateY(-3px);border-color:var(--line-2);box-shadow:0 18px 40px -28px rgba(0,0,0,.18)}
  .live-card .corner{position:absolute;top:0;right:0;font-family:var(--mono);font-size:10px;letter-spacing:.18em;text-transform:uppercase;color:var(--teal-deep);background:var(--teal-soft);padding:6px 12px;border-bottom-left-radius:12px;border-bottom:1px solid var(--line);border-left:1px solid var(--line)}
  .live-card .logo{width:54px;height:54px;border-radius:12px;background:var(--bg);display:grid;place-items:center;border:1px solid var(--line)}
  .live-card h4{font-family:var(--serif);font-size:30px;letter-spacing:-0.02em;font-weight:500;line-height:1.05}
  .live-card .desc{color:var(--ink-2);font-size:15px;line-height:1.55;flex:1}
  .live-card .ft{display:flex;align-items:center;justify-content:space-between;padding-top:18px;border-top:1px dashed var(--line);font-family:var(--mono);font-size:11px;letter-spacing:.14em;text-transform:uppercase;color:var(--ink-3)}

  /* Speaker */
  .speaker-wrap{display:grid;grid-template-columns:380px 1fr;gap:64px;align-items:start}
  .portrait{position:relative;border-radius:14px;overflow:hidden;background:var(--bg-2);aspect-ratio:4/5}
  .portrait img{width:100%;height:100%;object-fit:cover;display:block;filter:saturate(.9) contrast(1.02)}
  .portrait .badge{position:absolute;left:18px;bottom:18px;background:var(--paper);border:1px solid var(--line);border-radius:999px;padding:8px 14px;font-family:var(--mono);font-size:11px;letter-spacing:.14em;text-transform:uppercase}
  .speaker-name{font-family:var(--serif);font-size:64px;font-weight:500;letter-spacing:-0.025em;line-height:1}
  .speaker-role{font-family:var(--serif);font-size:22px;color:var(--ink-2);margin-top:14px;font-style:italic;font-weight:400}
  .speaker-bio{margin-top:28px;color:var(--ink-2);font-size:16.5px;line-height:1.6;max-width:580px}
  .speaker-bio + .speaker-bio{margin-top:14px}
  .creds{display:grid;grid-template-columns:repeat(2,1fr);gap:14px;margin-top:32px;max-width:560px}
  .cred{border:1px solid var(--line);background:var(--paper);border-radius:10px;padding:16px;display:flex;align-items:center;gap:12px}
  .cred .ic{width:36px;height:36px;border-radius:8px;background:var(--bg);display:grid;place-items:center;color:var(--teal-deep);font-family:var(--serif);font-size:18px;font-weight:600}
  .cred .t{font-size:13.5px;color:var(--ink);font-weight:500;line-height:1.3}
  .cred .s{font-size:12px;color:var(--ink-3);margin-top:2px}

  /* Certificate / value */
  .value-grid{display:grid;grid-template-columns:1.1fr 1fr;gap:64px;align-items:center}
  .cert-icon{background:var(--paper);border:1px solid var(--line);border-radius:18px;padding:56px 36px;display:flex;flex-direction:column;align-items:center;gap:36px;position:relative;overflow:hidden}
  .cert-icon::before{content:'';position:absolute;inset:-40% -40% auto auto;width:80%;height:80%;background:radial-gradient(circle, rgba(91,87,166,.12), transparent 60%);pointer-events:none}
  .cert-icon::after{content:'';position:absolute;inset:auto auto -40% -40%;width:80%;height:80%;background:radial-gradient(circle, rgba(91,87,166,.07), transparent 60%);pointer-events:none}
  .cert-ic-stage{position:relative;display:flex;flex-direction:column;align-items:center;gap:36px}
  .medal{position:relative;width:220px;height:240px;display:grid;place-items:center}
  .medal .ring{position:absolute;border-radius:50%;border:1px solid var(--line-2)}
  .medal .ring.outer{inset:0;width:200px;height:200px;top:8px;left:10px;border:1px solid var(--line-2)}
  .medal .ring.inner{width:172px;height:172px;top:22px;left:24px;border:1px dashed var(--line-2)}
  .medal .core{width:140px;height:140px;border-radius:50%;background:var(--teal-deep);display:grid;place-items:center;position:relative;z-index:2;box-shadow:0 30px 60px -30px rgba(58,54,121,.55), inset 0 0 0 6px rgba(255,255,255,0.08)}
  .medal .core::after{content:'';position:absolute;inset:8px;border-radius:50%;border:1px solid rgba(255,255,255,0.22)}
  .medal .ribbon-l,.medal .ribbon-r{position:absolute;bottom:-8px;width:36px;height:80px;background:var(--teal-deep);z-index:1}
  .medal .ribbon-l{left:74px;clip-path:polygon(0 0,100% 0,100% 100%,50% 78%,0 100%);transform:rotate(-8deg);transform-origin:top center;background:linear-gradient(180deg,var(--teal-deep),#2a2563)}
  .medal .ribbon-r{right:74px;clip-path:polygon(0 0,100% 0,100% 100%,50% 78%,0 100%);transform:rotate(8deg);transform-origin:top center;background:linear-gradient(180deg,var(--teal-deep),#2a2563)}
  .cert-ic-label{text-align:center;position:relative;z-index:2}
  .cert-ic-title{font-family:var(--serif);font-size:40px;line-height:1.05;font-weight:500;letter-spacing:-0.02em;margin-top:10px}

  /* Register */

  .reg .blurb{color:#bcc3c4;font-family:var(--serif);font-size:21px;line-height:1.45;margin-top:24px;max-width:520px}

  .price .num{font-family:var(--serif);font-size:96px;line-height:1;font-weight:500;letter-spacing:-0.04em;color:var(--paper)}
  .price .per{font-family:var(--mono);font-size:11px;color:#9aa3a5;letter-spacing:.16em;text-transform:uppercase}
  .seats{font-family:var(--mono);font-size:11px;letter-spacing:.16em;text-transform:uppercase;color:#9aa3a5;display:flex;align-items:center;gap:10px}
  .seats .bar{width:140px;height:4px;border-radius:2px;background:rgba(255,255,255,0.08);overflow:hidden;display:inline-block}
  .seats .bar i{display:block;height:100%;width:62%;background:var(--teal);border-radius:2px}
  .cta-row{display:flex;gap:14px;margin-top:44px;flex-wrap:wrap}
  .btn{display:inline-flex;align-items:center;gap:12px;padding:18px 26px;border-radius:999px;font-family:var(--mono);font-size:12px;letter-spacing:.18em;text-transform:uppercase;transition:transform .15s ease, background .2s ease}

  .btn.primary:hover{background:#7570c6;transform:translateY(-1px)}
  .btn.ghost{background:transparent;color:var(--paper);border:1px solid #2c3637}
  .btn.ghost:hover{background:rgba(255,255,255,0.04)}
  .btn .arr{display:inline-block;transition:transform .2s ease}
  .btn:hover .arr{transform:translateX(3px)}

  /* QR card */
  .qr-card{background:var(--paper);color:var(--ink);border-radius:18px;padding:28px;position:relative}
  .qr-card .qr-top{display:flex;align-items:center;justify-content:space-between;font-family:var(--mono);font-size:11px;letter-spacing:.18em;text-transform:uppercase;color:var(--ink-3)}
  .qr-card .qr-host{display:flex;align-items:center;gap:14px;margin-top:22px}
  .qr-card .qr-host img{width:60px;height:60px;border-radius:50%;object-fit:cover;border:1px solid var(--line)}
  .qr-card .qr-host .n{font-family:var(--serif);font-size:21px;font-weight:500;letter-spacing:-0.01em}
  .qr-card .qr-host .r{font-size:12.5px;color:var(--ink-3);margin-top:2px}
  .qr-card .qr-img{margin-top:24px;border-radius:14px;background:#fff;padding:18px;display:grid;place-items:center;border:1px solid var(--line)}
  .qr-card .qr-img img{width:100%;height:auto;display:block;mix-blend-mode:multiply}
  .qr-card .qr-ft{display:flex;align-items:center;justify-content:space-between;margin-top:18px;font-family:var(--mono);font-size:10.5px;letter-spacing:.16em;text-transform:uppercase;color:var(--ink-3)}

  /* Footer */
  footer{padding:48px 0 64px;color:var(--ink-2);font-size:13px}
  footer .row{display:flex;align-items:center;justify-content:space-between;flex-wrap:wrap;gap:18px}
  footer .links{display:flex;gap:24px;font-family:var(--mono);font-size:11px;letter-spacing:.16em;text-transform:uppercase;color:var(--ink-2)}
  footer .links a:hover{color:var(--teal-deep)}

  /* Modal */
  .modal-overlay{position:fixed;inset:0;background:rgba(10,15,16,.55);backdrop-filter:blur(6px);display:grid;place-items:center;z-index:50;animation:fade .2s ease}
  @keyframes fade{from{opacity:0}to{opacity:1}}
  .modal{background:var(--paper);width:520px;max-width:92vw;border-radius:18px;padding:36px;position:relative;animation:rise .25s ease}
  @keyframes rise{from{transform:translateY(12px);opacity:0}to{transform:translateY(0);opacity:1}}
  .modal .x{position:absolute;top:18px;right:18px;width:34px;height:34px;border-radius:50%;display:grid;place-items:center;color:var(--ink-2);background:var(--bg)}
  .modal h3{font-family:var(--serif);font-size:34px;font-weight:500;letter-spacing:-0.02em;line-height:1.05}
  .modal h3 em{font-style:italic;color:var(--teal-deep)}
  .modal p{color:var(--ink-2);font-size:14.5px;margin-top:10px;line-height:1.5}
  .field{margin-top:18px}
  .field label{display:block;font-family:var(--mono);font-size:10.5px;letter-spacing:.16em;text-transform:uppercase;color:var(--ink-3);margin-bottom:8px}
  .field input, .field select{width:100%;padding:14px 16px;border:1px solid var(--line);border-radius:10px;background:#fff;font:inherit;font-size:15px;color:var(--ink);outline:none;transition:border-color .15s ease,box-shadow .15s ease}
  .field input:focus, .field select:focus{border-color:var(--teal-deep);box-shadow:0 0 0 4px rgba(91,87,166,.20)}
  .row2{display:grid;grid-template-columns:1fr 1fr;gap:14px}
  .modal .summary{margin-top:24px;border-top:1px solid var(--line);padding-top:18px;display:flex;justify-content:space-between;align-items:center}
  .modal .summary .t{font-family:var(--serif);font-size:18px}
  .modal .summary .p{font-family:var(--serif);font-size:26px;font-weight:500;letter-spacing:-0.02em}
  .modal .go{margin-top:24px;width:100%;padding:18px;background:var(--ink);color:var(--paper);border-radius:999px;font-family:var(--mono);font-size:12px;letter-spacing:.18em;text-transform:uppercase;display:flex;align-items:center;justify-content:center;gap:10px}
  .modal .go:hover{background:var(--teal-deep)}
  .modal .done{display:flex;flex-direction:column;align-items:center;text-align:center;gap:14px;padding:20px 0}
  .modal .done .ck{width:74px;height:74px;border-radius:50%;background:var(--teal);color:var(--paper);display:grid;place-items:center;font-size:34px}
  .modal .done h3{font-size:30px}
  .modal .done p{font-size:15px;max-width:380px}

  /* small */
  .ic-svg{display:inline-block;vertical-align:middle}

  /* ===== Print ===== */
  @media print {
    @page { size: 1280px 1810px; margin: 0; }
    html, body { background: var(--bg) !important; }
    * { -webkit-print-color-adjust: exact !important; print-color-adjust: exact !important; }
    body { width: 1280px; margin: 0 auto; }
    .top { padding: 18px 0 }
    .top-right .dot { animation: none !important; box-shadow: 0 0 0 4px rgba(91,87,166,.20) !important }
    /* kill marquee animation, freeze visible portion */
    .marquee { overflow: hidden }
    .marquee-track { animation: none !important; transform: none !important; padding: 14px 56px }
    /* hero */
    .hero { padding: 48px 0 24px; break-inside: avoid }
    h1.title { font-size: 92px }
    /* facts */
    .facts { break-inside: avoid }
    /* sections - keep tight, allow natural breaks */
    section.block { padding: 56px 0; break-inside: auto }
    .sec-head { margin-bottom: 32px; break-after: avoid }
    .sec-head .sec-title { font-size: 46px }
    /* curriculum: avoid splitting a row */
    .curric-row { break-inside: avoid }
    .cell.body { break-inside: avoid }
    /* live cards: avoid splitting */
    .live-card { break-inside: avoid }
    .live-grid { break-inside: avoid }
    /* speaker block tight */
    .speaker-wrap { break-inside: avoid }
    .portrait { aspect-ratio: 4/5 }
    /* certificate block */
    .value-grid { break-inside: avoid }
    .cert-icon { break-inside: avoid }
    /* dark register section: force colors */
    .reg { background: #15121E !important; color: var(--paper) !important }
    .reg .blurb, .reg .seats { color: #bcc3c4 !important }
    .reg .price .num { color: var(--paper) !important }
    .reg-grid { break-inside: avoid }
    .qr-card { break-inside: avoid }
    /* footer */
    footer { padding: 32px 0 36px }
    /* misc: kill hover transforms */
    .live-card:hover, .btn:hover, .btn.primary:hover, .curric-row:hover .cell.time { transform: none !important }
    /* hide bits not useful in print */
    .top-right .dot { display: inline-block }
  }
</style>

<body>
  <div id="root"></div>

<script type="text/babel" data-presets="react">
const { useState, useEffect, useMemo } = React;

function Eye({size=24, color='currentColor'}){
  return (
    <svg className="ic-svg" width={size} height={size} viewBox="0 0 24 24" fill="none" stroke={color} strokeWidth="1.6">
      <path d="M2 12c2.5-4.5 6-7 10-7s7.5 2.5 10 7c-2.5 4.5-6 7-10 7s-7.5-2.5-10-7z"/>
      <circle cx="12" cy="12" r="3.2"/>
    </svg>
  );
}
function Arrow({size=14}){return <svg className="ic-svg arr" width={size} height={size} viewBox="0 0 14 14" fill="none" stroke="currentColor" strokeWidth="1.6"><path d="M1 7h12M8 2l5 5-5 5"/></svg>}
function Cal(){return <svg className="ic-svg" width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="1.4"><rect x="3" y="5" width="18" height="16" rx="2"/><path d="M3 10h18M8 3v4M16 3v4"/></svg>}
function Clock(){return <svg className="ic-svg" width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="1.4"><circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/></svg>}
function Pin(){return <svg className="ic-svg" width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="1.4"><path d="M12 22s-7-7.5-7-13a7 7 0 0114 0c0 5.5-7 13-7 13z"/><circle cx="12" cy="9" r="2.5"/></svg>}
function Cap(){return <svg className="ic-svg" width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="1.4"><path d="M2 9l10-5 10 5-10 5L2 9z"/><path d="M6 11v5c0 1.7 3 3 6 3s6-1.3 6-3v-5"/></svg>}

function Countdown(){
  const target = new Date('2026-05-30T11:00:00+05:45').getTime();
  const [now,setNow] = useState(Date.now());
  useEffect(()=>{const t=setInterval(()=>setNow(Date.now()),1000);return()=>clearInterval(t)},[]);
  const diff = Math.max(0, target - now);
  const d = Math.floor(diff/86400000);
  const h = Math.floor((diff%86400000)/3600000);
  const m = Math.floor((diff%3600000)/60000);
  const s = Math.floor((diff%60000)/1000);
  const pad = n => String(n).padStart(2,'0');
  return (
    <div style={{display:'flex',gap:10,alignItems:'baseline'}}>
      <Unit n={pad(d)} l="days"/><Sep/><Unit n={pad(h)} l="hrs"/><Sep/><Unit n={pad(m)} l="min"/><Sep/><Unit n={pad(s)} l="sec"/>
    </div>
  );
}
function Unit({n,l}){return <div style={{textAlign:'center'}}><div style={{fontFamily:'var(--serif)',fontSize:34,lineHeight:1,fontWeight:500,letterSpacing:'-0.02em'}}>{n}</div><div style={{fontFamily:'var(--mono)',fontSize:9.5,letterSpacing:'.18em',textTransform:'uppercase',color:'var(--ink-3)',marginTop:6}}>{l}</div></div>}
function Sep(){return <div style={{fontFamily:'var(--serif)',fontSize:28,color:'var(--ink-3)',fontWeight:300}}>:</div>}

function Marquee(){
  const items = ['Live with NotebookLM','★','Live with Google Gemini','★','Real-time interactive quiz','★','Certificate of Completion','★','B.Optom 3rd & 4th year','★','Kathmandu · 30 May 2026','★'];
  const full = [...items,...items,...items];
  return (
    <div className="marquee">
      <div className="marquee-track">
        {full.map((t,i)=> t==='★' ? <span key={i} className="star">✦</span> : <span key={i}>{t}</span>)}
      </div>
    </div>
  );
}

function NotebookLogo(){
  return (
    <svg width="28" height="28" viewBox="0 0 32 32" fill="none">
      <rect x="4" y="4" width="24" height="24" rx="5" fill="#0F1A1C"/>
      <path d="M10 10h12M10 14h12M10 18h8M10 22h6" stroke="#fff" strokeWidth="1.6" strokeLinecap="round"/>
      <circle cx="22" cy="22" r="3" fill="#00B894"/>
    </svg>
  );
}
function GeminiLogo(){
  return (
    <svg width="28" height="28" viewBox="0 0 32 32" fill="none">
      <path d="M16 4l1.6 6.4L24 12l-6.4 1.6L16 20l-1.6-6.4L8 12l6.4-1.6L16 4z" fill="#00B894"/>
      <path d="M16 18l1 4 4 1-4 1-1 4-1-4-4-1 4-1 1-4z" fill="#0F1A1C"/>
    </svg>
  );
}
function QuizLogo(){
  return (
    <svg width="28" height="28" viewBox="0 0 32 32" fill="none" stroke="#0F1A1C" strokeWidth="1.8">
      <circle cx="16" cy="16" r="11" fill="#fff"/>
      <path d="M12 13a4 4 0 117 2.7c-1.5 1.3-2 1.8-2 3.3" strokeLinecap="round"/>
      <circle cx="17" cy="22" r="1.2" fill="#0F1A1C"/>
    </svg>
  );
}

function RegisterModal({open,onClose}){
  const [stage,setStage] = useState('form');
  const [form,setForm] = useState({name:'',email:'',phone:'',year:'3rd year'});
  if(!open) return null;
  return (
    <div className="modal-overlay" onClick={onClose}>
      <div className="modal" onClick={e=>e.stopPropagation()}>
        <button className="x" onClick={onClose}>✕</button>
        {stage==='form' ? (
          <>
            <div className="mono" style={{color:'var(--ink-3)'}}>Workshop Registration</div>
            <h3 style={{marginTop:10}}>Reserve your <em>seat</em></h3>
            <p>30 May 2026 · 11 AM – 2 PM · Kathmandu. Confirmation, venue and joining link will be sent to your email.</p>
            <div className="field"><label>Full name</label><input value={form.name} onChange={e=>setForm({...form,name:e.target.value})} placeholder="As on your college ID"/></div>
            <div className="row2">
              <div className="field"><label>Email</label><input value={form.email} onChange={e=>setForm({...form,email:e.target.value})} placeholder="you@email.com"/></div>
              <div className="field"><label>Phone</label><input value={form.phone} onChange={e=>setForm({...form,phone:e.target.value})} placeholder="98••••••••"/></div>
            </div>
            <div className="field"><label>Year of B.Optom</label>
              <select value={form.year} onChange={e=>setForm({...form,year:e.target.value})}>
                <option>3rd year</option><option>4th year</option><option>Intern / Recent grad</option><option>Faculty / Other</option>
              </select>
            </div>
            <div className="summary">
              <div className="t">Total · 1 seat</div>
              <div className="p">NPR 500</div>
            </div>
            <button className="go" onClick={()=>setStage('done')}>Confirm registration <Arrow/></button>
          </>
        ) : (
          <div className="done">
            <div className="ck">✓</div>
            <h3>You're <em>in</em>.</h3>
            <p>We've sent the venue details and joining link to <b>{form.email||'your email'}</b>. See you on 30 May.</p>
            <button className="go" onClick={onClose}>Close</button>
          </div>
        )}
      </div>
    </div>
  );
}

const curriculum = [
  {time:'11:00', dur:'15 min', tag:'Opening', title:'Why this session, and why now', body:'A non-linear path from teaching to e-commerce in London to building AI tools in Nepal — and the parts of that journey that will matter most in your career.'},
  {time:'11:15', dur:'25 min', tag:'Block 1', title:'AI Literacy & Prompting', body:'What AI actually is in plain language. The anatomy of a great prompt — Role · Task · Context · Format — with a side-by-side weak vs. strong example you can reuse tomorrow.'},
  {time:'11:40', dur:'25 min', tag:'Block 2', title:'AI in eye-care practice', body:'Patient education in Nepali or English. Front-desk FAQs, follow-ups, study & CPD, product explainers — practical workflows for a real clinic.'},
  {time:'12:05', dur:'25 min', tag:'Block 3', title:'Digital marketing & your brand', body:'Get found on Google. The 80/20 of social content. Build a LinkedIn that gets you noticed before you apply. Hands-on with NotebookLM and Gemini.'},
  {time:'12:50', dur:'10 min', tag:'Ethics', title:'Use AI responsibly', body:'Hallucination, patient privacy, accountability. The golden rule: AI assists, the optometrist decides. Every output is a first draft, never the final word.'},
  {time:'13:15', dur:'30 min', tag:'Live', title:'Interactive quiz · 15 questions', body:'Phones out. Fastest correct answers win. A timed, real-time leaderboard to consolidate what we covered.'},
  {time:'13:45', dur:'15 min', tag:'Wrap', title:'Q&A and certificate handover', body:'Open floor for questions and the Certificate of Participation for every attendee.'},
];

function App(){
  return (
    <>
      {/* Top bar */}
      <div className="wrap">
        <div className="top">
          <div className="brand">
            <img className="karya-mark" src="assets/karya-mark.png" alt="Karya Technology"/>
            <div className="brand-name">Karya Technology</div>
            <div className="brand-sub">Continuing Education · Kathmandu</div>
          </div>
          <div className="top-right">
            <span><span className="dot"></span>Registration open</span>
            <span>·</span>
            <span>30 · 05 · 2026</span>
          </div>
        </div>
      </div>

      {/* Hero */}
      <div className="wrap">
        <section className="hero">
          <div className="hero-grid">
            <div>
              <div className="eyebrow">
                <span className="pill mono"><span className="d"></span>Workshop · 3 hours</span>
                <span className="mono" style={{color:'var(--ink-3)'}}>For B.Optom 3rd & 4th year · Kathmandu</span>
              </div>
              <h1 className="title">AI &amp; Digital<br/>Skills for the<br/><em>Modern Optometrist.</em></h1>
              <p className="lede">Working smarter in the clinic, reaching more patients online, and <span className="accent">building a career that stands out</span> — a hands-on session with live demos on NotebookLM, Google Gemini and a real-time quiz.</p>
            </div>
            <div className="hero-meta">
              <div className="row">
                <div className="mono k">When</div>
                <div className="v">Saturday, 30 May 2026</div>
                <div className="vv">11:00 AM — 2:00 PM NPT</div>
              </div>
              <div className="row">
                <div className="mono k">Where</div>
                <div className="v">Kathmandu, Nepal</div>
                <div className="vv">In-person · venue on confirmation</div>
              </div>
              <div className="row">
                <div className="mono k">Countdown</div>
                <div style={{marginTop:10}}><Countdown/></div>
              </div>
            </div>
          </div>
        </section>
      </div>

      <Marquee/>

      {/* Facts */}
      <div className="wrap">
        <div className="facts">
          <div className="fact">
            <div className="ic"><Cal/></div>
            <div className="mono lbl">Date</div>
            <div className="val">30 May 2026</div>
            <div className="sub">Saturday · Holiday-friendly schedule for college students.</div>
          </div>
          <div className="fact">
            <div className="ic"><Clock/></div>
            <div className="mono lbl">Duration</div>
            <div className="val">11 AM — 2 PM</div>
            <div className="sub">Three focused hours · one short break · interactive throughout.</div>
          </div>
          <div className="fact">
            <div className="ic"><Cap/></div>
            <div className="mono lbl">You leave with</div>
            <div className="val">A signed certificate</div>
            <div className="sub">A Certificate of Participation for every attendee.</div>
          </div>
        </div>
      </div>

      {/* Curriculum */}
      <div className="wrap">
        <section className="block">
          <div className="sec-head">
            <div className="sec-num">Part 01<span className="big">Run of show</span></div>
            <h2 className="sec-title">Three hours, built to be <em>useful</em> on Monday morning.</h2>
            <p className="sec-desc">Each block ends with a deliverable you can take back to your clinic, your studies or your professional profile — not just slides you'll forget.</p>
          </div>

          <div className="curric">
            {curriculum.map((r,i)=>(
              <div className="curric-row" key={i}>
                <div className="cell time">{r.time}<br/><span style={{color:'var(--ink-3)'}}>{r.dur}</span></div>
                <div className="cell body">
                  <div style={{flex:1}}>
                    <h3>{r.title}<span className="tag">{r.tag}</span></h3>
                    <p>{r.body}</p>
                  </div>
                </div>
              </div>
            ))}
            <div style={{borderTop:'1px solid var(--line)',gridColumn:'1 / -1',height:0}}></div>
          </div>
        </section>
      </div>

      {/* Live activities */}
      <div className="wrap">
        <section className="block" style={{paddingTop:64}}>

// Auto-print: wait for fonts + images, then print.
(function(){
  function waitForImages(){
    const imgs = Array.from(document.images);
    return Promise.all(imgs.map(img => img.complete ? Promise.resolve() : new Promise(r => { img.onload = img.onerror = r; })));
  }
  window.addEventListener('load', async () => {
    try { if (document.fonts && document.fonts.ready) { await document.fonts.ready; } } catch(e){}
    await waitForImages();
    // give React + countdown a beat
    await new Promise(r => setTimeout(r, 700));
    window.print();
  });
})();
